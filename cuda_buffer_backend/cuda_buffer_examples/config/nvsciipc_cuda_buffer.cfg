# NvSciIpc endpoint pairs for cuda_buffer's NvSci storage backend.
#
# Every pair of processes that share NvSci buffers needs one INTER_PROCESS
# pair. cuda_buffer claims them at runtime from the pairs listed in its
# endpoint pool inventory, nvsci_endpoint_pool.json next to this file, which
# lists exactly these. Sixteen pairs serve up to sixteen pairs of processes at
# once; to add pairs, add them to both files.
#
# Append these lines to /etc/nvsciipc.cfg and restart the NvSciIpc service
# (sudo systemctl restart nv_nvsciipc_init, or reboot), then install the
# inventory as /etc/cuda_buffer/nvsci_endpoint_pool.json:
#
#   Jetson (L4T):  <backend> <endpoint1> <endpoint2> <frames> <frame size>
#   x86 (nvsci):   the same, followed by a group id. Processes that open an
#                  endpoint must be members of that group.
#
# The lines below use the x86 format with group ids 31000 and up; on Jetson,
# drop the last column.
INTER_PROCESS   cuda_buffer_0    cuda_buffer_1    16  24576  31000
INTER_PROCESS   cuda_buffer_2    cuda_buffer_3    16  24576  31001
INTER_PROCESS   cuda_buffer_4    cuda_buffer_5    16  24576  31002
INTER_PROCESS   cuda_buffer_6    cuda_buffer_7    16  24576  31003
INTER_PROCESS   cuda_buffer_8    cuda_buffer_9    16  24576  31004
INTER_PROCESS   cuda_buffer_10   cuda_buffer_11   16  24576  31005
INTER_PROCESS   cuda_buffer_12   cuda_buffer_13   16  24576  31006
INTER_PROCESS   cuda_buffer_14   cuda_buffer_15   16  24576  31007
INTER_PROCESS   cuda_buffer_16   cuda_buffer_17   16  24576  31008
INTER_PROCESS   cuda_buffer_18   cuda_buffer_19   16  24576  31009
INTER_PROCESS   cuda_buffer_20   cuda_buffer_21   16  24576  31010
INTER_PROCESS   cuda_buffer_22   cuda_buffer_23   16  24576  31011
INTER_PROCESS   cuda_buffer_24   cuda_buffer_25   16  24576  31012
INTER_PROCESS   cuda_buffer_26   cuda_buffer_27   16  24576  31013
INTER_PROCESS   cuda_buffer_28   cuda_buffer_29   16  24576  31014
INTER_PROCESS   cuda_buffer_30   cuda_buffer_31   16  24576  31015
